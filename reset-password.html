<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futursat — Recupero Accesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020814;
      --accent: #1e90ff;
      --violet: #6366f1;
      --text: #ffffff;
      --text2: rgba(255,255,255,.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Background layers ───────────────────────────── */
    .bg-gradient {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% -5%,  rgba(30,144,255,.22) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 15% 100%, rgba(99,102,241,.14) 0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 88% 90%,  rgba(30,144,255,.10) 0%, transparent 55%),
        #020814;
    }

    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(30,144,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,144,255,.045) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black 10%, transparent 80%);
    }

    /* ── Floating orbs ───────────────────────────────── */
    .orb {
      position: fixed; border-radius: 50%; z-index: 0;
      filter: blur(80px); opacity: .18; animation: drift 14s ease-in-out infinite alternate;
    }
    .orb-1 { width: 480px; height: 480px; background: #1e90ff; top: -140px; left: -80px; animation-delay: 0s; }
    .orb-2 { width: 360px; height: 360px; background: #6366f1; bottom: -80px; right: -60px; animation-delay: -5s; }
    .orb-3 { width: 260px; height: 260px; background: #0ea5e9; top: 45%; left: 55%; animation-delay: -9s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, -25px) scale(1.06); }
    }

    /* ── Card ────────────────────────────────────────── */
    .card {
      position: relative; z-index: 10;
      width: 100%; max-width: 520px;
      margin: 24px;
      padding: 56px 48px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 28px;
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow:
        0 0 0 1px rgba(30,144,255,.06),
        0 40px 100px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.07);
      text-align: center;
    }

    /* ── Logo ─────────────────────────────────────────── */
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 48px;
    }

    .logo-wrap img {
      height: 60px; width: auto; object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(30,144,255,.3));
    }

    /* ── Divider ─────────────────────────────────────── */
    .divider {
      width: 48px; height: 2px;
      background: linear-gradient(90deg, #1e90ff, #6366f1);
      border-radius: 2px;
      margin: 0 auto 36px;
      box-shadow: 0 0 12px rgba(30,144,255,.5);
    }

    /* ── Lock icon ───────────────────────────────────── */
    .icon-wrap {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: rgba(30,144,255,.1);
      border: 1px solid rgba(30,144,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      margin: 0 auto 28px;
      box-shadow: 0 0 30px rgba(30,144,255,.12);
    }

    /* ── Heading ─────────────────────────────────────── */
    .label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 3px;
      color: rgba(30,144,255,.85);
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 800;
      line-height: 1.3;
      color: #fff;
      margin-bottom: 10px;
      letter-spacing: .2px;
    }

    .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,.38);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    /* ── Email box ───────────────────────────────────── */
    .email-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(30,144,255,.08);
      border: 1px solid rgba(30,144,255,.25);
      border-radius: 14px;
      padding: 16px 24px;
      margin-bottom: 36px;
      transition: all .25s;
      cursor: default;
      width: 100%;
      justify-content: center;
    }

    .email-box:hover {
      background: rgba(30,144,255,.13);
      border-color: rgba(30,144,255,.45);
      box-shadow: 0 0 24px rgba(30,144,255,.15);
    }

    .email-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #1e90ff, #6366f1);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(30,144,255,.35);
    }

    .email-text { text-align: left; }

    .email-label {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: rgba(255,255,255,.3);
      margin-bottom: 3px;
    }

    .email-addr {
      font-size: 15px; font-weight: 700;
      color: #93c5fd;
      letter-spacing: .2px;
    }

    /* ── CTA ─────────────────────────────────────────── */
    .btn-mailto {
      display: inline-flex; align-items: center; gap: 10px;
      width: 100%;
      padding: 15px 28px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1e90ff 0%, #6366f1 100%);
      color: #fff;
      font-size: 14px; font-weight: 700;
      text-decoration: none;
      justify-content: center;
      box-shadow: 0 4px 24px rgba(30,144,255,.38);
      transition: all .22s;
      margin-bottom: 20px;
      border: none;
      cursor: pointer;
    }

    .btn-mailto:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 36px rgba(30,144,255,.48);
    }

    .btn-back {
      display: inline-flex; align-items: center; gap: 8px;
      width: 100%; padding: 13px 28px;
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.45);
      font-size: 14px; font-weight: 500;
      text-decoration: none;
      justify-content: center;
      transition: all .2s;
      cursor: pointer;
    }

    .btn-back:hover {
      background: rgba(255,255,255,.07);
      border-color: rgba(255,255,255,.15);
      color: rgba(255,255,255,.7);
    }

    /* ── Corner badge ────────────────────────────────── */
    .secure-badge {
      position: absolute;
      top: 18px; right: 18px;
      display: flex; align-items: center; gap: 5px;
      background: rgba(16,185,129,.1);
      border: 1px solid rgba(16,185,129,.2);
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 10px; font-weight: 600;
      color: #6ee7b7;
      letter-spacing: .5px;
    }

    .secure-dot {
      width: 5px; height: 5px;
      background: #10b981; border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    /* ── Particles ───────────────────────────────────── */
    canvas {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none; opacity: .45;
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
      .logo-wrap { margin-bottom: 36px; }
    }
  </style>
</head>
<body>

  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <canvas id="particles"></canvas>

  <div class="card">

    <div class="secure-badge">
      <div class="secure-dot"></div>
      SISTEMA SICURO
    </div>

    <div class="logo-wrap">
      <img src="logo-futursat.png" alt="Futursat">
    </div>

    <div class="divider"></div>

    <div class="icon-wrap">🔐</div>

    <div class="label">Recupero Accesso</div>

    <h1>CONTATTARE L'AMMINISTRAZIONE<br>DI SISTEMA</h1>

    <p class="subtitle">
      Per motivi di sicurezza, il reset della password viene gestito<br>
      direttamente dall'amministrazione. Contatta il supporto.
    </p>

    <div class="email-box">
      <div class="email-icon">✉️</div>
      <div class="email-text">
        <div class="email-label">Indirizzo supporto</div>
        <div class="email-addr">supporto@futurkloud.it</div>
      </div>
    </div>

    <a class="btn-mailto" href="mailto:supporto@futurkloud.it?subject=Richiesta%20reset%20password%20Futursat&body=Buongiorno%2C%0A%0ASto%20richiedendo%20il%20reset%20della%20password%20per%20l%27accesso%20al%20gestionale%20Futursat.%0A%0AEmail%20account%3A%20%0A%0AGrazie.">
      ✉&nbsp;&nbsp;Scrivi all'amministrazione
    </a>

    <a class="btn-back" href="/login.html">
      ← Torna al login
    </a>

  </div>

  <script>
    // Particle canvas
    const canvas = document.getElementById('particles');
    const ctx    = canvas.getContext('2d');
    let W, H, particles = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function mkParticle() {
      return {
        x:  Math.random() * W,
        y:  Math.random() * H,
        r:  Math.random() * 1.4 + .4,
        vx: (Math.random() - .5) * .3,
        vy: (Math.random() - .5) * .3,
        a:  Math.random(),
        da: (Math.random() * .006 + .002) * (Math.random() < .5 ? 1 : -1),
      };
    }

    function initParticles(n = 90) {
      particles = Array.from({ length: n }, mkParticle);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        p.a = Math.max(0, Math.min(1, p.a + p.da));
        if (p.a <= 0 || p.a >= 1) p.da *= -1;
        if (p.x < -10) p.x = W + 10;
        if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10;
        if (p.y > H + 10) p.y = -10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(147,197,253,${p.a * .55})`;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); initParticles(); });
    resize();
    initParticles();
    draw();
  </script>

</body>
</html>
