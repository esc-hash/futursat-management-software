<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futursat — Recupero Accesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#F8FAFC; --surface:#FFFFFF; --border:#E2E8F0;
      --accent:#2563EB; --accent-lt:#EFF6FF; --glow:rgba(37,99,235,.12);
      --green:#10B981; --text:#0F172A; --text2:#475569; --text3:#94A3B8;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg); color:var(--text);
      font-family:'Inter', system-ui, sans-serif;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px; -webkit-font-smoothing:antialiased;
    }
    body::before {
      content:''; position:fixed; inset:0; z-index:0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -5%, rgba(37,99,235,.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 80% 90%, rgba(37,99,235,.04) 0%, transparent 50%);
    }
    .card {
      position:relative; z-index:1; width:100%; max-width:480px;
      background:var(--surface); border:1px solid var(--border); border-radius:20px;
      padding:44px 44px 36px; text-align:center;
      box-shadow:0 4px 24px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.04);
    }
    .secure-badge {
      position:absolute; top:16px; right:16px;
      display:flex; align-items:center; gap:5px;
      background:#ECFDF5; border:1px solid rgba(16,185,129,.25);
      border-radius:20px; padding:4px 10px;
      font-size:10px; font-weight:600; color:#065F46; letter-spacing:.5px;
    }
    .secure-dot {
      width:6px; height:6px; background:var(--green); border-radius:50%;
      animation:blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .logo-wrap { display:flex; justify-content:center; margin-bottom:36px; }
    .logo-wrap img { height:52px; width:auto; object-fit:contain; }

    .icon-wrap {
      width:64px; height:64px; border-radius:16px;
      background:var(--accent-lt); border:1px solid rgba(37,99,235,.2);
      display:flex; align-items:center; justify-content:center;
      font-size:26px; margin:0 auto 20px;
    }

    .label {
      font-size:11px; font-weight:600; text-transform:uppercase;
      letter-spacing:2px; color:var(--accent); margin-bottom:10px;
    }
    h1 {
      font-family:'Plus Jakarta Sans', 'Inter', sans-serif;
      font-size:clamp(16px,3.5vw,20px); font-weight:800;
      color:var(--text); line-height:1.3; margin-bottom:10px;
    }
    .subtitle {
      font-size:13px; color:var(--text3); line-height:1.6; margin-bottom:28px;
    }

    .email-box {
      display:flex; align-items:center; gap:12px; justify-content:center;
      background:var(--accent-lt); border:1px solid rgba(37,99,235,.2);
      border-radius:12px; padding:14px 20px; margin-bottom:28px;
      transition:all .2s;
    }
    .email-box:hover { border-color:rgba(37,99,235,.4); box-shadow:0 0 0 3px var(--glow); }
    .email-icon {
      width:36px; height:36px; background:var(--accent); border-radius:9px;
      display:flex; align-items:center; justify-content:center;
      font-size:16px; flex-shrink:0;
    }
    .email-text { text-align:left; }
    .email-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); margin-bottom:2px; }
    .email-addr  { font-size:15px; font-weight:700; color:var(--accent); }

    .btn-mailto {
      display:flex; align-items:center; gap:8px; justify-content:center; width:100%;
      padding:12px 24px; border-radius:8px; margin-bottom:12px;
      background:var(--accent); border:none; color:#fff;
      font-size:14px; font-weight:600; font-family:inherit;
      text-decoration:none; cursor:pointer; transition:all .18s;
      box-shadow:0 1px 3px rgba(37,99,235,.3);
    }
    .btn-mailto:hover { background:#1D4ED8; transform:translateY(-1px); box-shadow:0 4px 12px rgba(37,99,235,.35); }

    .btn-back {
      display:flex; align-items:center; gap:8px; justify-content:center; width:100%;
      padding:11px 24px; border-radius:8px;
      background:var(--bg); border:1px solid var(--border); color:var(--text2);
      font-size:14px; font-weight:500; font-family:inherit;
      text-decoration:none; cursor:pointer; transition:all .18s;
    }
    .btn-back:hover { background:var(--surface); border-color:var(--accent); color:var(--accent); }

    @media(max-width:480px){ .card{ padding:28px 20px; } }
  </style>
</head>
<body>

  <div class="card">
    <div class="secure-badge">
      <div class="secure-dot"></div>
      SISTEMA SICURO
    </div>

    <div class="logo-wrap">
      <img src="logo-futursat.png" alt="Futursat">
    </div>

    <div class="icon-wrap">🔐</div>

    <div class="label">Recupero Accesso</div>
    <h1>CONTATTARE L'AMMINISTRAZIONE<br>DI SISTEMA</h1>
    <p class="subtitle">
      Per motivi di sicurezza, il reset della password<br>
      viene gestito direttamente dall'amministrazione.
    </p>

    <div class="email-box">
      <div class="email-icon">✉️</div>
      <div class="email-text">
        <div class="email-label">Indirizzo supporto</div>
        <div class="email-addr">supporto@futurkloud.it</div>
      </div>
    </div>

    <a class="btn-mailto"
      href="mailto:supporto@futurkloud.it?subject=Richiesta%20reset%20password%20Futursat&body=Buongiorno%2C%0A%0ASto%20richiedendo%20il%20reset%20della%20password%20per%20l%27accesso%20al%20gestionale%20Futursat.%0A%0AEmail%20account%3A%20%0A%0AGrazie.">
      ✉&nbsp;&nbsp;Scrivi all'amministrazione
    </a>

    <a class="btn-back" href="/login.html">← Torna al login</a>
  </div>

</body>
</html>
